name: Framework checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - run: make init
      - run: npm audit --audit-level=high
      - run: make test
      - run: make docs
      - run: make build
      - run: make review
      - uses: actions/upload-artifact@v4
        with:
          name: quicklang-framework
          path: |
            dist/
            build/test-results/
            build/compliance/
            build/docs/site/
