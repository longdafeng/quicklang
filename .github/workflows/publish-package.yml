name: Remove obsolete desktop container
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete the obsolete QuickLang container package
        shell: bash
        run: |
          set -euo pipefail
          endpoint=users/longdafeng/packages/container/quicklang
          gh api "$endpoint" > package.json
          jq -e '.name == "quicklang" and .repository.full_name == "longdafeng/quicklang"' package.json
          gh api --method DELETE "$endpoint"
          if gh api "$endpoint" > remaining.json 2> error.txt; then
            echo "Package still exists"
            exit 1
          fi
          grep -q 'HTTP 404' error.txt
          echo "Verified QuickLang container package deleted" >> "$GITHUB_STEP_SUMMARY"
