# Stable application aliases; provider/model and credentials live in the gateway.
model_list:
  - model_name: quicklang-chat
    litellm_params:
      model: os.environ/QUICKLANG_CHAT_MODEL
      api_key: os.environ/QUICKLANG_CHAT_API_KEY
  - model_name: quicklang-transcribe
    litellm_params:
      model: os.environ/QUICKLANG_TRANSCRIPTION_MODEL
      api_key: os.environ/QUICKLANG_TRANSCRIPTION_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
