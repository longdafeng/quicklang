<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><title>整合执行看板</title>
<style>body{background:#101826;color:#e7edf5;font:15px/1.6 system-ui;margin:0;padding:28px}main{max-width:1650px;margin:auto}h1{font-size:28px;margin:0}h2{font-size:19px}p{color:#afbdd1}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.metric{background:#1b293c;padding:12px 24px;border-radius:10px}.metric b{font-size:26px;display:block}.controls{display:flex;gap:12px;margin:16px 0}button,select{background:#24374f;color:white;border:1px solid #455b74;border-radius:6px;padding:8px}section{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1100px;background:#162234}th,td{padding:12px;text-align:left;border-bottom:1px solid #304057;vertical-align:top;white-space:pre-line}th{color:#a9bdd8}small{display:block;color:#8fa4bf}.完成,.通过,.已结束{color:#81dba9}.等待{color:#ffc978}.阻塞{color:#ff939b}.运行中{color:#72dafa}.未启动{color:#9cb7e9}footer{color:#93a7c1;margin-top:20px}a{color:#94c5ff}.stale{color:#ffba79}.legend{display:flex;gap:18px;flex-wrap:wrap}.legend span{max-width:270px}</style>
<main><h1>长期复习 × 长期错题本 · 整合执行看板</h1><p id="meta"></p><p id="freshness"></p><div class="stats" id="stats"></div><div class="legend" id="legend"></div><p id="note"></p><h2>并行执行记录</h2><p>下列耗时是执行者本轮的完整时间。同一执行者处理多个任务，不重复计为每个任务的独立工时。</p><section><table><thead><tr><th>执行者</th><th>当前状态</th><th>起始时间</th><th>结束时间</th><th>本轮耗时</th><th>结果</th></tr></thead><tbody id="workers"></tbody></table></section><h2>任务与依赖队列</h2><div class="controls"><select id="filter"><option>全部任务</option><option>运行中</option><option>等待</option><option>阻塞</option><option>未启动</option><option>已结束</option></select><button onclick="location.reload()">立即刷新</button><a href="status.json">原始状态数据</a></div><section><table><thead><tr><th>任务 / 名称</th><th>进度</th><th>执行状态</th><th>负责方</th><th>等待对象 / 原因 / 依赖</th><th>起始时间</th><th>结束时间</th><th>任务耗时</th><th>验收证据 / 范围</th></tr></thead><tbody id="rows"></tbody></table></section><footer id="footer"></footer></main>
<script src="status.js"></script><script>
const d=window.integrationStatus;
const fmt=x=>x?new Date(x).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'未采集';
const elapsed=x=>x==null||!Number.isFinite(x)?'未采集':x<60?x.toFixed(2)+' 秒':Math.floor(x/60)+' 分 '+Math.round(x%60)+' 秒';
function cells(tr,values){values.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});return tr}
function render(){const age=Math.max(0,(Date.now()-Date.parse(d.updatedAt))/1000);document.getElementById('meta').textContent='分支：'+d.branch+' · 状态核对：'+fmt(d.updatedAt)+' · 当前时间：'+fmt(new Date().toISOString())+'（北京时间）';const fresh=document.getElementById('freshness');fresh.className=age>120?'stale':'';fresh.textContent=age>120?'状态已超过 2 分钟未核对；下表为最近快照，无法确认现在是否仍在运行。':'状态为最近核对快照；'+d.blockerNote;const stats=document.getElementById('stats');stats.replaceChildren();for(const s of ['运行中','等待','阻塞','未启动','已结束']){const e=document.createElement('div');e.className='metric '+s;const b=document.createElement('b');b.textContent=d.tasks.filter(t=>t.executionState===s).length;e.append(b,s);stats.append(e)}const body=document.getElementById('rows');body.replaceChildren();const f=document.getElementById('filter').value;for(const t of d.tasks){if(f!=='全部任务'&&f!==t.executionState)continue;const reason=[t.waitingOn,t.blockReason,t.executionReason,t.dependencies?.length?'依赖：'+t.dependencies.join('、'):null].filter(Boolean).join('\n');const tr=cells(document.createElement('tr'),[t.id+' '+t.name,t.status,t.executionState,t.assignee||'主 agent / 待调度',reason,t.start?fmt(t.start):t.executionState==='未启动'?'尚未开始':'未采集',t.end?fmt(t.end):'未采集',t.duration!=null?elapsed(t.duration):'未采集',t.evidence+'\n范围：'+t.scope]);tr.children[2].className=t.executionState;const sm=document.createElement('small');sm.textContent=t.timing;tr.children[7].append(sm);body.append(tr)}}
const workers=document.getElementById('workers');for(const w of d.workers){const tr=cells(document.createElement('tr'),[w.name,w.state,fmt(w.start),fmt(w.end),w.end?elapsed(w.duration):elapsed((Date.now()-Date.parse(w.start))/1000),w.result]);tr.children[1].className=w.state;workers.append(tr)}for(const [name,description] of Object.entries(d.executionLegend)){const e=document.createElement('span');const b=document.createElement('b');b.textContent=name+'：';b.className=name;e.append(b,description);document.getElementById('legend').append(e)}document.getElementById('note').textContent=d.refreshNote;document.getElementById('footer').textContent='等待时间不等于执行耗时；未采集的数据不估算。子任务完成不代表整个整合已经验收。';document.getElementById('filter').addEventListener('change',render);render();setInterval(render,1000);
</script></html>
